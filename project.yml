name: Perch
options:
  bundleIdPrefix: com.CHANGEME
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Perch.xcconfig
  Release: Config/Perch.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    # The screenshot harness in PerchWatch/Debug is compiled only when DEBUG is
    # defined. XcodeGen's Debug preset sets this too; make it explicit so CI can
    # never build an inert harness by accident.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
packages:
  XKit:
    path: Packages/XKit
targets:
  Perch:
    type: application
    platform: iOS
    sources:
      - path: Perch
      - path: Shared
    dependencies:
      - target: PerchWatch
      - package: XKit
    info:
      path: Perch/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID)
        PRODUCT_NAME: Perch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PerchWatch:
    type: application
    platform: watchOS
    sources:
      - path: PerchWatch
        excludes:
          - "Debug/Fixtures"
          - "Debug/Fixtures/**"
          - "Debug/Fixtures/*.json"
      # Screenshot-harness fixtures: explicit resources so they always end up in
      # the bundle (DEBUG builds / CI screenshots only).
      - path: PerchWatch/Debug/Fixtures
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: XKit
      - target: PerchWidget
        embed: true
    info:
      path: PerchWatch/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PERCH_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        # Videos keep playing (audio) with the wrist down / app in the background,
        # like a music player (long-form audio, Bluetooth output on watchOS).
        UIBackgroundModes: [audio]
        PerchAppGroup: "group.$(PERCH_BUNDLE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: PerchWatch
        TARGETED_DEVICE_FAMILY: "4"
        # Series 9/10/Ultra 2 run arm64; older watches arm64_32. Ship both.
        ARCHS: "arm64 arm64_32"
        # watchOS Simulator is arm64 on the Apple Silicon CI runner (arm64_32 is
        # not a simulator architecture, so keep it out of simulator builds).
        "ARCHS[sdk=watchsimulator*]": "arm64"
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/PerchWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # R20: the whole screenshot harness (PerchWatch/Debug) is compiled into
        # DEBUG builds only. Release builds also get no fixture JSON. Everything
        # here is additionally wrapped in #if DEBUG, so a stale project file can
        # never make a shipping build depend on it.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "PerchDebug.swift FixtureXClient.swift FixtureHarness.swift CrownProbe.swift *.json"
  # crown-lab: watchOS UI tests (Digital Crown routing). Debug only (the scheme
  # below runs it in Debug); it is not part of the Perch / PerchWatch schemes, so
  # their builds (CI `Build` + `Watch screens`) are unchanged.
  PerchWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: PerchWatchUITests
    dependencies:
      - target: PerchWatch
    settings:
      base:
        # Xcode's "Target Application" for the runner.
        TEST_TARGET_NAME: PerchWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID).watchkitapp.uitests
        # The base config disables generated plists (the app targets ship their own);
        # a test bundle has none.
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: "arm64 arm64_32"
        "ARCHS[sdk=watchsimulator*]": "arm64"
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
  PerchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: PerchWidget
      # Only these shared files are needed; keep the whole Shared folder out of the widget.
      - path: Shared/AppGroup.swift
    info:
      path: PerchWidget/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PerchAppGroup: "group.$(PERCH_BUNDLE_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID).watchkitapp.widget
        PRODUCT_NAME: PerchWidget
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: "arm64 arm64_32"
        "ARCHS[sdk=watchsimulator*]": "arm64"
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/PerchWidget.entitlements
schemes:
  Perch:
    build:
      targets:
        Perch: all
        PerchWatch: all
        PerchWidget: all
    run:
      config: Debug
    archive:
      config: Release
  PerchWatch:
    build:
      targets:
        PerchWatch: all
        PerchWidget: all
    run:
      config: Debug
  # crown-lab: dedicated scheme for the crown routing UI tests, so the screens
  # workflow's `xcodebuild build -scheme PerchWatch` stays exactly as it was.
  PerchWatchCrown:
    build:
      targets:
        PerchWatch: all
        PerchWidget: all
        PerchWatchUITests: [test]
    test:
      config: Debug
      targets:
        - PerchWatchUITests
    run:
      config: Debug
