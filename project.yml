name: Perch
options:
  bundleIdPrefix: com.CHANGEME
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Perch.xcconfig
  Release: Config/Perch.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  XKit:
    path: Packages/XKit
targets:
  Perch:
    type: application
    platform: iOS
    sources:
      - path: Perch
      - path: Shared
    dependencies:
      - target: PerchWatch
      - package: XKit
    info:
      path: Perch/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID)
        PRODUCT_NAME: Perch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PerchWatch:
    type: application
    platform: watchOS
    sources:
      - path: PerchWatch
      - path: Shared
    dependencies:
      - package: XKit
      - target: PerchWidget
        embed: true
    info:
      path: PerchWatch/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PERCH_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        PerchAppGroup: "group.$(PERCH_BUNDLE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: PerchWatch
        TARGETED_DEVICE_FAMILY: "4"
        # Series 9/10/Ultra 2 run arm64; older watches arm64_32. Ship both.
        ARCHS: "arm64 arm64_32"
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/PerchWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PerchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: PerchWidget
      # Only these shared files are needed; keep the whole Shared folder out of the widget.
      - path: Shared/AppGroup.swift
    info:
      path: PerchWidget/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PerchAppGroup: "group.$(PERCH_BUNDLE_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PERCH_BUNDLE_ID).watchkitapp.widget
        PRODUCT_NAME: PerchWidget
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: "arm64 arm64_32"
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/PerchWidget.entitlements
schemes:
  Perch:
    build:
      targets:
        Perch: all
        PerchWatch: all
        PerchWidget: all
    run:
      config: Debug
    archive:
      config: Release
  PerchWatch:
    build:
      targets:
        PerchWatch: all
        PerchWidget: all
    run:
      config: Debug
